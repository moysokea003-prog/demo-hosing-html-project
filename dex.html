<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klar Klok</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--text:#3b1d0f;--accent:#c62828;--gold:#f2b705;--line:#e8d5b5;--win:#2e7d32}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1210;--card:#2b1b17;--text:#f6e7d3;--accent:#ef5350;--gold:#ffca28;--line:#4a332b;--win:#81c784}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Khmer OS",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{text-align:center;margin:8px 0 2px;color:var(--accent)}
.sub{text-align:center;margin:0 0 14px;opacity:.75;font-size:.9rem}
.bar{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.bar span b{color:var(--gold)}
.dice{display:flex;gap:12px;justify-content:center;margin:18px 0}
.die{width:92px;height:92px;border-radius:18px;background:#fff;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 4px 0 var(--accent)}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}100%{transform:rotate(-8deg) translateY(0)}}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.cell:hover{border-color:var(--gold)}
.cell.hit{border-color:var(--win);box-shadow:0 0 0 3px var(--win)}
.cell .em{font-size:2.4rem;display:block}
.cell .nm{font-size:.8rem;opacity:.8}
.cell .bet{display:block;min-height:1.3em;font-weight:700;color:var(--accent)}
.row{display:flex;gap:10px;margin-top:14px}
button.act{flex:1;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#roll{background:var(--accent);color:#fff}
#clear{background:var(--card);color:var(--text);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;justify-content:center;margin-top:14px}
.chip{width:52px;height:52px;border-radius:50%;border:3px dashed #fff;background:var(--gold);color:#3b1d0f;font-weight:800;cursor:pointer;outline:2px solid var(--gold)}
.chip.on{outline:3px solid var(--accent)}
#msg{min-height:2.6em;text-align:center;margin-top:14px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>ខ្លាឃ្លោក Klar Klok</h1>
<p class="sub">Pick a chip, tap the pictures to bet, then roll the dice.</p>
<div class="bar"><span>Coins: <b id="coins">1000</b></span><span>Bet: <b id="total">0</b></span></div>
<div class="dice"><div class="die" id="d0">🎲</div><div class="die" id="d1">🎲</div><div class="die" id="d2">🎲</div></div>
<div class="board" id="board"></div>
<div class="chips" id="chips"></div>
<div class="row"><button class="act" id="clear">Clear bets</button><button class="act" id="roll">Roll!</button></div>
<div id="msg"></div>
</main>

<script>
const S=[{e:"🎃",n:"Gourd · ឃ្លោក"},{e:"🐯",n:"Tiger · ខ្លា"},{e:"🐓",n:"Rooster · មាន់"},{e:"🐟",n:"Fish · ត្រី"},{e:"🦀",n:"Crab · ក្តាម"},{e:"🦐",n:"Shrimp · បង្កង"}];
let coins=1000,chip=10,bets=Array(6).fill(0),busy=false;
const $=id=>document.getElementById(id);

function total(){return bets.reduce((a,b)=>a+b,0)}
function draw(){
  $("coins").textContent=coins;
  $("total").textContent=total();
  document.querySelectorAll(".cell").forEach((c,i)=>c.querySelector(".bet").textContent=bets[i]||"");
}

// បង្កើតប៊ូតុងរូបភាពទាំង ៦
S.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="cell";
  b.innerHTML=`<span class="em">${s.e}</span><span class="nm">${s.n}</span><span class="bet"></span>`;
  b.onclick=()=>{if(busy||total()+chip>coins)return;bets[i]+=chip;draw()};
  $("board").appendChild(b);
});

// បង្កើត chip
[10,50,100,500].forEach(v=>{
  const c=document.createElement("button");
  c.className="chip"+(v===chip?" on":"");
  c.textContent=v;
  c.onclick=()=>{chip=v;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c))};
  $("chips").appendChild(c);
});

$("clear").onclick=()=>{if(!busy){bets.fill(0);draw()}};

// ចុច Roll
$("roll").onclick=()=>{
  if(busy)return;
  if(!total()){$("msg").textContent="Place a bet first.";return}
  busy=true;$("roll").disabled=true;$("msg").textContent="";
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("hit"));
  const ds=[0,1,2].map(i=>$("d"+i));
  ds.forEach(d=>d.classList.add("roll"));
  const t=setInterval(()=>ds.forEach(d=>d.textContent=S[Math.random()*6|0].e),90);

  setTimeout(()=>{
    clearInterval(t);
    const r=[0,0,0].map(()=>Math.random()*6|0);
    ds.forEach((d,i)=>{d.classList.remove("roll");d.textContent=S[r[i]].e});

    let net=0;
    bets.forEach((b,i)=>{
      if(!b)return;
      const m=r.filter(x=>x===i).length;
      net+=m?b*m:-b;
    });
    r.forEach(i=>document.querySelectorAll(".cell")[i].classList.add("hit"));
    coins+=net;
    $("msg").textContent=net>0?`You won ${net} coins!`:net<0?`You lost ${-net} coins.`:"Break even.";
    bets.fill(0);busy=false;$("roll").disabled=false;
    if(coins<=0){coins=1000;$("msg").textContent+=" Out of coins, so here is a fresh 1000."}
    draw();
  },1200);
};
draw();
</script>
</body>
</html>
